<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f4a35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Recanto">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Painel — Mi Casa Su Casa</title>
  <link rel="stylesheet" href="css/painel.css">
  <script src="js/topo-ao-carregar.js" defer></script>
</head>
<body class="painel">
  <button class="sys-mobile-toggle" id="sys-mobile-toggle" aria-label="Abrir menu" aria-expanded="false">☰ Menu</button>
  <div class="sys-shell">
    <aside class="sys-sidebar">
      <div class="sys-sidebar-brand">
        <div class="sys-logo-wrap">
          <img src="icons/logo%20boa.png" alt="Mi Casa Su Casa" class="sys-logo-img" width="120" height="48" decoding="async" />
        </div>
        <div class="sys-brand-text">
          <strong>Mi Casa Su Casa</strong>
          <span>Painel administrativo</span>
        </div>
      </div>
      <p class="sys-nav-group-label">Menu</p>
      <nav class="sys-sidebar-nav" aria-label="Secções do painel">
        <button type="button" class="sys-nav-btn active" data-tab="faturamento">Faturamento</button>
        <button type="button" class="sys-nav-btn" data-tab="ficha">Ficha de reserva</button>
        <button type="button" class="sys-nav-btn" data-tab="quartos">Quartos</button>
        <button type="button" class="sys-nav-btn" data-tab="calendario">Configuração</button>
      </nav>
      <div class="sys-sidebar-footer">
        <button type="button" class="sys-nav-btn sys-nav-btn--ghost" id="btn-logout" data-sidebar-action="voltar">Terminar sessão</button>
        <a href="index.html" class="sys-voltar">← Voltar ao site</a>
      </div>
    </aside>

    <main class="sys-main">
      <header class="sys-main-head">
        <nav class="sys-breadcrumb" aria-label="Localização no painel">
          <span class="sys-breadcrumb-root">Painel</span>
          <span class="sys-breadcrumb-sep" aria-hidden="true">›</span>
          <span id="sys-breadcrumb-current" class="sys-breadcrumb-current">Faturamento</span>
        </nav>
        <div class="sys-main-head-center">
          <form id="app-header-search-form" class="sys-app-search" role="search" aria-label="Buscar no painel">
            <span class="sys-app-search-icon" aria-hidden="true"></span>
            <input
              id="app-header-search"
              class="sys-app-search-input"
              type="search"
              name="q"
              autocomplete="off"
              enterkeyhint="search"
              placeholder="Buscar reservas, quartos ou código…"
            />
            <button type="submit" class="sys-app-search-submit">Buscar</button>
          </form>
        </div>
        <div class="sys-main-head-actions">
          <span class="sys-head-icon sys-head-icon--user" title="Conta" aria-hidden="true"></span>
        </div>
      </header>
      <div class="sys-main-body">
        <section class="sys-tab active" id="tab-faturamento"></section>
        <section class="sys-tab" id="tab-ficha"></section>
        <section class="sys-tab" id="tab-quartos"></section>
        <section class="sys-tab" id="tab-calendario"></section>
      </div>
    </main>
  </div>
  <div class="sys-modal" id="reserva-modal" hidden>
    <div class="sys-modal-backdrop" data-close-modal="true"></div>
    <div class="sys-modal-card" id="reserva-modal-card"></div>
  </div>
  <div class="sys-modal" id="quarto-editor-modal" hidden>
    <div class="sys-modal-backdrop" data-quarto-modal-close="true"></div>
    <div class="sys-modal-card sys-modal-card--quarto" id="quarto-editor-card"></div>
  </div>
  <script src="js/quartos-site.js"></script>
  <script src="js/quartos-imagens-pastas.js"></script>
  <script src="js/reservar-precos.js"></script>
  <script src="js/system-store.js"></script>
  <script src="js/galeria-imagens-lista.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
