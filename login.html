<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar — Painel Mi Casa, Su Casa</title>
  <link rel="stylesheet" href="css/painel.css">
  <link rel="stylesheet" href="css/lucide.css">
  <style>
    body.login-painel {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #eef2f0 0%, #ffffff 55%);
      padding: 1.5rem;
    }
    .login-card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: var(--shadow-md);
    }
    .login-card h1 {
      margin: 0 0 0.35rem;
      font-size: 1.45rem;
      color: var(--text);
    }
    .login-card p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .login-field {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
    }
    .login-field label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text);
    }
    .login-field input {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 0.8rem;
      font: inherit;
      font-size: 0.95rem;
    }
    .login-field input:focus {
      outline: none;
      border-color: rgba(45, 106, 74, 0.55);
      box-shadow: 0 0 0 3px rgba(45, 106, 74, 0.12);
    }
    .login-error {
      display: none;
      margin-bottom: 0.85rem;
      padding: 0.55rem 0.75rem;
      border-radius: 10px;
      background: #fdecec;
      color: #8b1e1e;
      font-size: 0.86rem;
    }
    .login-error.is-visible { display: block; }
    .login-submit {
      width: 100%;
      margin-top: 0.35rem;
      border: none;
      border-radius: 999px;
      padding: 0.72rem 1rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
    }
    .login-submit:hover { background: var(--primary-strong); }
    .login-submit:disabled { opacity: 0.65; cursor: wait; }
    .login-back {
      display: inline-block;
      margin-top: 1rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
    }
  </style>
</head>
<body class="login-painel">
  <main class="login-card">
    <h1>Painel administrativo</h1>
    <p>Entre com suas credenciais para gerenciar reservas e quartos.</p>
    <div id="login-error" class="login-error" role="alert"></div>
    <form id="login-form">
      <div class="login-field">
        <label for="login-user">E-mail</label>
        <input id="login-user" name="username" type="email" autocomplete="username" required />
      </div>
      <div class="login-field">
        <label for="login-pass">Senha</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
      </div>
      <button type="submit" class="login-submit" id="login-submit">Entrar</button>
    </form>
    <a class="login-back" href="index.html">← Voltar ao site</a>
  </main>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var err = document.getElementById('login-error');
      var btn = document.getElementById('login-submit');
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || '/painel.html';

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        err.classList.remove('is-visible');
        btn.disabled = true;
        btn.textContent = 'Entrando…';

        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-user').value,
            password: document.getElementById('login-pass').value
          })
        })
          .then(function (res) {
            var ct = (res.headers.get('content-type') || '').toLowerCase();
            if (ct.indexOf('application/json') === -1) {
              throw new Error(
                'Servidor indisponível. Abra http://localhost:3014/login.html e confirme que npm start está em execução.'
              );
            }
            return res.json().then(function (data) {
              if (res.status === 429) {
                throw new Error(
                  (data && data.error) ||
                    'Muitas tentativas de login. Aguarde 15 minutos e tente novamente.'
                );
              }
              if (!res.ok) throw new Error((data && data.error) || 'Falha no login.');
              window.location.href = next;
            });
          })
          .catch(function (e) {
            err.textContent = e.message || 'Não foi possível entrar.';
            err.classList.add('is-visible');
            btn.disabled = false;
            btn.textContent = 'Entrar';
          });
      });
    })();
  </script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="js/lucide-init.js"></script>
</body>
</html>
