# Mi Casa Su Casa — proxy reverso para PM2 (porta 3014)
# Copiar na VPS:
#   sudo cp deploy/nginx-miicasasucasa.conf /etc/nginx/sites-available/mi-casa
#   sudo ln -sf /etc/nginx/sites-available/mi-casa /etc/nginx/sites-enabled/mi-casa
#   sudo nginx -t && sudo systemctl reload nginx
#
# NÃO apague outros ficheiros em sites-enabled — cada site usa server_name diferente.

server {
    listen 80;
    listen [::]:80;
    server_name miicasasucasa.com.br www.miicasasucasa.com.br;

    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
